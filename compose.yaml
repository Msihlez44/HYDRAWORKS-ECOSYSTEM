services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hydraworks
      POSTGRES_USER: hydraworks
      POSTGRES_PASSWORD: change-this-local-password
    ports:
      - "5432:5432"
    volumes:
      - hydraworks_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydraworks -d hydraworks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hydraworks_postgres:
